name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Extract version from commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          message = os.environ.get('COMMIT_MESSAGE', '')
          match = re.search(
              r'\[build\]\s*v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)',
              message,
              re.IGNORECASE,
          )
          if match is None:
              sys.exit(
                  "Missing version in commit message. "
                  "Use a message like '[build] v1.2.3'."
              )

          version = match.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
              output.write(f'tag=v{version}\n')
          PY

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: maclookup-linux
          - os: windows-latest
            artifact: maclookup-windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build executable
        run: >-
          pyinstaller --onefile
          --name "maclookup-${{ needs.prepare.outputs.version }}"
          maclookup.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/maclookup-*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: maclookup-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
